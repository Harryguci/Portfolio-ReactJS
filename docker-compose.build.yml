# Overlay for local machine only: build & tag images, then push to registry.
# Usage:
#   $env:DOCKER_DEFAULT_PLATFORM='linux/amd64'   # PowerShell
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.yml -f docker-compose.build.yml push
# Or: pnpm docker:release

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}:api-${IMAGE_TAG:-latest}

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX}:web-${IMAGE_TAG:-latest}
